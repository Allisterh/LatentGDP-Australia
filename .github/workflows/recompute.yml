name: Recompute latent GDP estimate

on:
  schedule:
    # ABS 5206.0 publishes ~11:30 Sydney on the first Wed of Mar/Jun/Sep/Dec.
    # We run every Wednesday at 02:00 UTC (12:00 Sydney AEST / 13:00 AEDT).
    # Each run fetches the data and fingerprints the inputs (R/input_hash.R);
    # if nothing changed since the published estimate, the fit, site build,
    # commit and deploy are all skipped and the job still succeeds.
    - cron: '0 2 * * 3'
  workflow_dispatch:       # manual trigger from the UI
    inputs:
      force:
        description: 'Refit and redeploy even if the inputs are unchanged'
        type: boolean
        required: false
        default: false

permissions:
  contents: write          # to commit docs/ updates back to master
  pages: write             # to deploy GitHub Pages
  id-token: write          # required by deploy-pages

concurrency:
  group: latentgdp-recompute
  cancel-in-progress: false

env:
  CMDSTAN_VERSION: '2.39.0'

jobs:
  recompute:
    runs-on: ubuntu-latest
    # The production fit (m13 since 2026-10-18; m12 before) takes about 23-28 min on
    # 4 local cores (m12: 21-26 min); neither has been measured on GitHub's runners.
    # The limit was raised from 90 to 120 min for m12 and is unchanged for m13.
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::posterior
            any::readabs
            any::dplyr
            any::tidyr
            any::ggplot2
            any::jsonlite
            any::openssl

      - name: Fetch latest ABS data
        run: Rscript R/01_fetch_data.R

      # Fingerprint data + production code and compare with the hash recorded
      # in the committed docs/diagnostics.json. Unchanged -> skip everything
      # below (no refit, no commit, no deploy). workflow_dispatch "force"
      # bypasses the check.
      - name: Detect input changes
        id: inputs
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          set -euo pipefail
          new_hash=$(Rscript R/input_hash.R)
          old_hash=$(jq -r '.input_hash // ""' docs/diagnostics.json 2>/dev/null || true)
          echo "input hash (new):       ${new_hash}"
          echo "input hash (published): ${old_hash:-<none>}"
          if [ "${FORCE}" = "true" ]; then
            echo "Forced run requested - recomputing regardless of inputs."
            changed=true
          elif [ -n "${old_hash}" ] && [ "${new_hash}" = "${old_hash}" ]; then
            echo "Inputs unchanged since the published estimate - skipping fit, build, commit and deploy."
            changed=false
          else
            echo "Inputs changed - recomputing."
            changed=true
          fi
          echo "hash=${new_hash}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          {
            echo "### Input check"
            echo "- new: \`${new_hash}\`"
            echo "- published: \`${old_hash:-none}\`"
            echo "- force: ${FORCE}; recompute: **${changed}**"
          } >> "$GITHUB_STEP_SUMMARY"

      # cmdstanr isn't on CRAN, so pak (used by setup-r-dependencies) can't
      # resolve it. Install it directly from the stan-dev r-universe.
      - name: Install cmdstanr from r-universe
        if: steps.inputs.outputs.changed == 'true'
        run: |
          install.packages(
            "cmdstanr",
            repos = c("https://stan-dev.r-universe.dev",
                      "https://cloud.r-project.org")
          )
        shell: Rscript {0}

      # Runner image id (e.g. ubuntu24) goes into the binary cache keys so a
      # runner-image upgrade can't restore binaries built against old libs.
      - name: Cache key inputs
        if: steps.inputs.outputs.changed == 'true'
        id: keys
        run: echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore CmdStan install
        if: steps.inputs.outputs.changed == 'true'
        id: cache-cmdstan
        uses: actions/cache/restore@v6
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ steps.keys.outputs.image }}

      - name: Install CmdStan if cache miss
        if: steps.inputs.outputs.changed == 'true' && steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: |
          Rscript -e 'cmdstanr::check_cmdstan_toolchain(fix = TRUE); cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)'

      - name: Save CmdStan install
        if: steps.inputs.outputs.changed == 'true' && steps.cache-cmdstan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cmdstan
          key: ${{ steps.cache-cmdstan.outputs.cache-primary-key }}

      # Compiled production model. Keyed on the .stan source and the CmdStan
      # version, so a restored binary always matches the source. cmdstanr
      # (0.9, CmdStanModel$compile) recompiles whenever
      # file.mtime(exe) < file.mtime(stan_file); checkout stamps the .stan with
      # the current time and the cache restores the exe's old mtime, so touch
      # the exe after a hit to make cmdstanr reuse it.
      - name: Restore compiled m13 executable
        if: steps.inputs.outputs.changed == 'true'
        id: cache-exe
        uses: actions/cache/restore@v6
        with:
          path: stan/m13_serial_latent_sv
          key: m13-exe-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ steps.keys.outputs.image }}-${{ hashFiles('stan/m13_serial_latent_sv.stan') }}

      - name: Mark restored executable as up to date
        if: steps.inputs.outputs.changed == 'true' && steps.cache-exe.outputs.cache-hit == 'true'
        run: |
          touch stan/m13_serial_latent_sv
          ls -l --time-style=full-iso stan/m13_serial_latent_sv.stan stan/m13_serial_latent_sv

      - name: Fit production model (m13)
        if: steps.inputs.outputs.changed == 'true'
        run: Rscript R/fit_production.R

      # Saved right after the fit (whether or not the quality gate passed), so
      # a failed gate doesn't throw away a fresh compile.
      - name: Save compiled m13 executable
        if: always() && steps.inputs.outputs.changed == 'true' && steps.cache-exe.outputs.cache-hit != 'true' && hashFiles('stan/m13_serial_latent_sv') != ''
        uses: actions/cache/save@v6
        with:
          path: stan/m13_serial_latent_sv
          key: ${{ steps.cache-exe.outputs.cache-primary-key }}

      - name: Write estimates and build site
        if: steps.inputs.outputs.changed == 'true'
        run: |
          Rscript R/output_estimate.R
          Rscript R/build_site.R

      - name: Commit updated docs/ back to master
        if: steps.inputs.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to docs/ - skipping commit."
          else
            DATE=$(date -u +'%Y-%m-%d')
            git commit -m "auto: refresh estimate ${DATE}"
            git push
          fi

      - name: Upload Pages artifact
        if: steps.inputs.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: recompute
    if: needs.recompute.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
